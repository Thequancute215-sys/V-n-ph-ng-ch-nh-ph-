<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
// Máy tính dùng Thế Quân OS (os.html), văn phòng 3D giữ cho điện thoại / máy bảng cảm ứng.
if (!/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) && !(/Macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1)) {
  location.replace("os.html" + location.hash);
}
</script>
<title>Văn phòng 3D</title>
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<meta name="theme-color" content="#0b1220">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="app.js" defer></script>
<style>
:root { --bg: #0b1220; --panel: rgba(12, 18, 32, .8); --line: rgba(255, 255, 255, .14); --text: #f1f5f9; --muted: #94a3b8; --accent: #f59e0b; --focus: #38bdf8; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
#gl, #lbl { position: fixed; inset: 0; }
#gl { touch-action: none; }
#lbl { pointer-events: none; }
.panel { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); backdrop-filter: blur(14px); }
.hud { position: fixed; left: 16px; top: 16px; max-width: 360px; padding: 12px 16px; }
.hud h1 { margin: 0 0 4px; font-size: 16px; }
.hud p { margin: 0 0 4px; color: var(--muted); font-size: 12px; }
.hud kbd { display: inline-block; min-width: 20px; padding: 0 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; font: 600 11px/18px "Segoe UI", sans-serif; text-align: center; color: var(--text); background: rgba(255, 255, 255, .06); }
.hud a { color: var(--accent); font-size: 12px; text-decoration: none; font-weight: 600; }
.bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; padding: 10px 12px; width: max-content; max-width: calc(100vw - 32px); }
button { font: inherit; font-weight: 600; font-size: 13px; color: var(--text); background: rgba(255, 255, 255, .08); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
button:hover { background: rgba(255, 255, 255, .16); }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.time { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.time input { width: 150px; accent-color: var(--accent); }
.time b { color: var(--text); min-width: 44px; font-variant-numeric: tabular-nums; }
.time select { font: inherit; font-size: 13px; color: var(--text); background: rgba(255, 255, 255, .08); border: 1px solid var(--line); border-radius: 8px; padding: 5px 6px; }
.time select option { color: #0f172a; }
.wx { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; }
button[aria-pressed="true"] { background: var(--accent); color: #111827; border-color: transparent; }
#state { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; background: var(--bg); z-index: 5; transition: opacity .8s; }
#state.done { opacity: 0; pointer-events: none; }
#state p { margin: 0; color: var(--muted); }
.spin { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: sp 1s linear infinite; margin: 0 auto 12px; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (max-width: 900px) {
  .hud { padding: 8px 12px; max-width: 46vw; }
  .hud h1 { font-size: 13px; }
  .hud .keys { display: none; }
}
@media (max-width: 560px) {
  .hud { right: 16px; max-width: none; }
  .vp-room { top: 86px !important; }
  .bar { gap: 6px; padding: 8px; }
  .time input { width: 110px; }
  button { padding: 7px 10px; font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } #state { transition: none; } }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="gl"></div>
<div id="lbl"></div>

<div class="hud panel">
  <h1>Văn phòng 3D · bản xem trước</h1>
  <p class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> đi · <kbd>Shift</kbd> chạy · <kbd>Space</kbd> nhảy · kéo chuột xoay camera · cuộn để gần/xa</p>
  <a href="index.html">← Về văn phòng chính</a>
</div>

<div class="bar panel" role="toolbar" aria-label="Điều khiển">
  <button id="btnCam" title="Phím C">Camera sau lưng</button>
  <button id="btnHome" title="Phím R">Về cổng</button>
  <span class="wx" id="wxTxt" role="status">Hà Nội · đang lấy thời tiết…</span>
  <button id="btnLive" aria-pressed="true" title="Giờ Việt Nam và thời tiết Hà Nội thật">Giờ thật VN</button>
  <label class="time">Giờ <input id="hour" type="range" min="5" max="21" step="0.25" value="15.5" aria-label="Giờ trong ngày"> <b id="hourTxt">15:30</b></label>
  <label class="time">Thời tiết <select id="wxPick" aria-label="Chọn thời tiết">
    <option value="live">Thật (Hà Nội)</option><option value="clear">Nắng</option><option value="cloudy">Nhiều mây</option>
    <option value="rain">Mưa</option><option value="storm">Giông</option><option value="fog">Sương mù</option>
  </select></label>
</div>

<div id="state" role="status"><div><div class="spin"></div><p id="stateTxt">Đang dựng văn phòng…</p></div></div>

<script>
// Nếu không tải được three.js (mất mạng tới CDN) hoặc máy không có WebGL thì báo rõ thay vì để màn hình chờ mãi.
window.vp3dFail = (msg) => {
  const s = document.getElementById("state");
  s.classList.remove("done");
  s.querySelector(".spin").style.display = "none";
  document.getElementById("stateTxt").textContent = msg;
};
setTimeout(() => { if (!window.vp3dReady) window.vp3dFail("Không tải được thư viện 3D. Kiểm tra mạng tới cdn.jsdelivr.net rồi tải lại trang."); }, 20000);
</script>

<script type="module">
import { createOffice } from "./vanphong3d.js";
import { connectLive, vietnamHour } from "./thoitiet.js";
const $ = (id) => document.getElementById(id);
let office;
try {
  office = createOffice({
    gl: $("gl"), lbl: $("lbl"), hour: parseFloat($("hour").value), cardStyle: "top:16px;right:16px",
    onReady: () => { window.vp3dReady = true; $("state").classList.add("done"); },
  });
} catch (err) {
  window.vp3dFail(err.message);
  throw err;
}
const showHour = (h) => { const hh = Math.floor(h), mm = Math.round((h - hh) * 60); $("hourTxt").textContent = String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0"); };
showHour(parseFloat($("hour").value));
$("hour").addEventListener("input", (e) => { const h = parseFloat(e.target.value); office.setHour(h); showHour(h); });
$("hour").addEventListener("change", (e) => e.target.blur());
// Giờ Việt Nam + thời tiết Hà Nội thật; kéo thanh giờ hoặc chọn thời tiết thì chuyển sang tự chỉnh để xem thử.
const PRESETS = {
  clear: { cloud: 0.15 }, cloudy: { cloud: 0.95, wind: 1.4 }, rain: { cloud: 1, rain: 0.75, wind: 1.6 },
  storm: { cloud: 1, rain: 1, storm: 1, wind: 2.6 }, fog: { cloud: 0.7, fog: 1, wind: 0.5 },
};
const wxLine = (w) => !w ? "đang lấy thời tiết…" : w.error ? "chưa lấy được thời tiết (" + w.error + ", thử lại sau 2 phút)" : `${w.temp}°C · ${w.text}${w.stale ? " (cũ)" : ""}`;
let live = null;   // onUpdate chạy ngay lần đầu, trước khi connectLive trả về
live = connectLive(office, {
  onUpdate: ({ place, clock, weather }) => {
    $("wxTxt").textContent = `${place} · ${clock} · ${wxLine(weather)}`;
    if (!live?.manualHour) { const h = vietnamHour(); $("hour").value = Math.min(21, Math.max(5, h)); showHour(h); }
  },
});
const setLive = (on) => {
  live.manualHour = !on;
  $("btnLive").setAttribute("aria-pressed", String(on));
  if (on) live.refresh();
};
$("btnLive").onclick = (e) => { setLive(live.manualHour); e.currentTarget.blur(); };
$("hour").addEventListener("input", () => setLive(false), { capture: true });
$("wxPick").addEventListener("change", (e) => {
  const v = e.target.value;
  live.manualWeather = v !== "live";
  if (v === "live") { if (live.weather?.scene) office.setWeather(live.weather.scene); } else office.setWeather(PRESETS[v]);
  e.target.blur();
});
$("btnCam").onclick = (e) => { office.cameraBehind(); e.currentTarget.blur(); };
$("btnHome").onclick = (e) => { office.goHome(); e.currentTarget.blur(); };
</script>
</body>
</html>
