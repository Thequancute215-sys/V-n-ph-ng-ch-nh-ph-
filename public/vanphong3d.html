<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Văn phòng 3D</title>
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<meta name="theme-color" content="#0b1220">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="app.js" defer></script>
<style>
:root { --bg: #0b1220; --panel: rgba(12, 18, 32, .78); --line: rgba(255, 255, 255, .14); --text: #f1f5f9; --muted: #94a3b8; --accent: #f59e0b; --focus: #38bdf8; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
#gl, #lbl { position: fixed; inset: 0; }
#lbl { pointer-events: none; }
.hud { position: fixed; left: 16px; top: 16px; max-width: 340px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); backdrop-filter: blur(14px); }
.hud h1 { margin: 0 0 2px; font-size: 16px; }
.hud p { margin: 0; color: var(--muted); font-size: 12px; }
.hud a { color: var(--accent); font-size: 12px; text-decoration: none; font-weight: 600; }
.bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); backdrop-filter: blur(14px); width: max-content; max-width: calc(100vw - 32px); }
button { font: inherit; font-weight: 600; font-size: 13px; color: var(--text); background: rgba(255, 255, 255, .08); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
button:hover { background: rgba(255, 255, 255, .16); }
button[aria-pressed="true"] { background: var(--accent); color: #111827; border-color: transparent; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.time { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.time input { width: 150px; accent-color: var(--accent); }
.time b { color: var(--text); min-width: 44px; font-variant-numeric: tabular-nums; }
.lbl { padding: 3px 9px; border-radius: 999px; background: rgba(15, 23, 42, .82); border: 1px solid rgba(255, 255, 255, .2); color: #f8fafc; font-size: 12px; font-weight: 600; white-space: nowrap; }
.lbl.name { font-size: 11px; color: #0f172a; border-color: transparent; }
#state { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; background: var(--bg); z-index: 5; transition: opacity .8s; }
#state.done { opacity: 0; pointer-events: none; }
#state p { margin: 0; color: var(--muted); }
.spin { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: sp 1s linear infinite; margin: 0 auto 12px; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (max-width: 640px) {
  .hud { right: 16px; max-width: none; padding: 10px 12px; }
  .hud p { display: none; }
  .bar { gap: 6px; padding: 8px; }
  .time input { width: 110px; }
  button { padding: 7px 10px; font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } #state { transition: none; } }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="gl"></div>
<div id="lbl"></div>

<div class="hud">
  <h1>Văn phòng 3D · bản xem trước</h1>
  <p>Kéo chuột để xoay, cuộn để phóng to. Bấm “Trong văn phòng” để vào bên trong.</p>
  <a href="index.html">← Về văn phòng chính</a>
</div>

<div class="bar" role="toolbar" aria-label="Điều khiển cảnh">
  <button id="btnOut" aria-pressed="true">Ngoài trời</button>
  <button id="btnIn" aria-pressed="false">Trong văn phòng</button>
  <button id="btnRoof" aria-pressed="false" title="Ẩn mái để nhìn xuyên từ trên xuống">Mở mái</button>
  <button id="btnTour" aria-pressed="false">Tự quay</button>
  <label class="time">Giờ <input id="hour" type="range" min="5" max="21" step="0.25" value="15.5" aria-label="Giờ trong ngày"> <b id="hourTxt">15:30</b></label>
</div>

<div id="state" role="status"><div><div class="spin"></div><p id="stateTxt">Đang dựng văn phòng…</p></div></div>

<script>
// Nếu không tải được three.js (mất mạng tới CDN) hoặc máy không có WebGL thì báo rõ thay vì để màn hình chờ mãi.
window.vp3dFail = (msg) => {
  const s = document.getElementById("state");
  s.classList.remove("done");
  s.querySelector(".spin").style.display = "none";
  document.getElementById("stateTxt").textContent = msg;
};
setTimeout(() => { if (!window.vp3dReady) window.vp3dFail("Không tải được thư viện 3D. Kiểm tra mạng tới cdn.jsdelivr.net rồi tải lại trang."); }, 20000);
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

const $ = (id) => document.getElementById(id);
const { clamp, lerp, smoothstep, degToRad } = THREE.MathUtils;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

// Ngẫu nhiên có hạt giống: cây, mây, hoa đứng yên một chỗ mỗi lần tải trang.
let seed = 20261102;
const rnd = () => { seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const range = (a, b) => a + rnd() * (b - a);
const pick = (arr) => arr[Math.floor(rnd() * arr.length)];

let gl;
try {
  gl = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
} catch {
  window.vp3dFail("Trình duyệt này không bật được WebGL nên không vẽ được cảnh 3D.");
  throw new Error("WebGL unavailable");
}
gl.setPixelRatio(Math.min(devicePixelRatio, 1.5));
gl.toneMapping = THREE.ACESFilmicToneMapping;
gl.toneMappingExposure = 0.5;
gl.shadowMap.enabled = true;
gl.shadowMap.type = THREE.PCFSoftShadowMap;
$("gl").appendChild(gl.domElement);
const lblR = new CSS2DRenderer();
$("lbl").appendChild(lblR.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xbcd9ee, 0.0014);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 4000);
const controls = new OrbitControls(camera, gl.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotateSpeed = 0.45;

function resize() {
  gl.setSize(innerWidth, innerHeight);
  lblR.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

// ================= Vật liệu & khối dùng chung =================
const UNIT = new THREE.BoxGeometry(1, 1, 1);
// Ánh sáng bầu trời rất mạnh; giảm phần phản chiếu môi trường để màu không bị bạc.
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0, envMapIntensity: 0.45, ...o });
function box(mat, sx, sy, sz, x, y, z, parent = scene, ry = 0) {
  const m = new THREE.Mesh(UNIT, mat);
  m.scale.set(sx, sy, sz); m.position.set(x, y, z); m.rotation.y = ry;
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}
function cyl(mat, rt, rb, hgt, x, y, z, parent = scene, seg = 24) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, hgt, seg), mat);
  m.position.set(x, y, z); m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = gl.capabilities.getMaxAnisotropy();
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
function label(text, x, y, z, parent = scene, color) {
  const d = document.createElement("div");
  d.className = color ? "lbl name" : "lbl";
  if (color) d.style.background = color;
  d.textContent = text;
  const o = new CSS2DObject(d);
  o.position.set(x, y, z);
  parent.add(o);
  return o;
}

// ================= Bầu trời, mây, sao =================
// Shader trời riêng: dải màu đỉnh trời → chân trời, đĩa mặt trời có quầng, trăng ban đêm.
// Sương mù lấy đúng màu chân trời nên mặt đất tan vào trời không có vệt nối.
const SKY = {
  day: { top: new THREE.Color(0x2a6bcc), hor: new THREE.Color(0xbcd9ee) },
  gold: { top: new THREE.Color(0x3b5b98), hor: new THREE.Color(0xf2a96f) },
  night: { top: new THREE.Color(0x040914), hor: new THREE.Color(0x17223a) },
};
const skyMat = new THREE.ShaderMaterial({
  uniforms: {
    uTop: { value: new THREE.Color() }, uHor: { value: new THREE.Color() }, uSunCol: { value: new THREE.Color() },
    uSun: { value: new THREE.Vector3(0, 1, 0) }, uMoon: { value: new THREE.Vector3(0, 1, 0) }, uNight: { value: 0 },
  },
  vertexShader: `varying vec3 vDir;
    void main() { vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }`,
  fragmentShader: `uniform vec3 uTop, uHor, uSunCol, uSun, uMoon; uniform float uNight; varying vec3 vDir;
    void main() {
      vec3 d = normalize(vDir);
      vec3 col = mix(uHor, uTop, pow(clamp(d.y, 0.0, 1.0), 0.45));
      col = mix(col, uHor * 0.9, smoothstep(0.0, -0.2, d.y));
      float s = max(dot(d, normalize(uSun)), 0.0);
      col += uSunCol * (smoothstep(0.99955, 0.9998, s) * 6.0 + pow(s, 80.0) * 0.35 + pow(s, 6.0) * 0.2);
      float m = max(dot(d, normalize(uMoon)), 0.0);
      col += vec3(0.86, 0.9, 1.0) * uNight * (smoothstep(0.9994, 0.9997, m) * 1.1 + pow(m, 50.0) * 0.07);
      gl_FragColor = vec4(col, 1.0);
      #include <colorspace_fragment>
    }`,
  side: THREE.BackSide, depthWrite: false, fog: false, toneMapped: false,
});
const skyGeo = new THREE.SphereGeometry(1000, 48, 24);
const skyDome = new THREE.Mesh(skyGeo, skyMat);
skyDome.renderOrder = -1;
scene.add(skyDome);

// Ánh sáng môi trường lấy từ chính bầu trời, nên vật thể đổi màu mượt theo giờ.
const pmrem = new THREE.PMREMGenerator(gl);
const envScene = new THREE.Scene();
envScene.add(new THREE.Mesh(skyGeo, skyMat));
let envRT = null, envDirty = true, envAt = 0;
function updateEnv() {
  const rt = pmrem.fromScene(envScene, 0.02);
  scene.environment = rt.texture;
  if (envRT) envRT.dispose();
  envRT = rt; envDirty = false; envAt = performance.now();
}

function cloudTexture() {
  return canvasTex(256, 128, (g) => {
    for (let i = 0; i < 16; i++) {
      const x = 46 + rnd() * 164, y = 58 + rnd() * 34, r = 20 + rnd() * 30;
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, "rgba(255,255,255,0.85)");
      gr.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    }
  });
}
const cloudTexs = [cloudTexture(), cloudTexture(), cloudTexture()];
const clouds = [];
for (let i = 0; i < 36; i++) {
  const mat = new THREE.SpriteMaterial({ map: cloudTexs[i % 3], transparent: true, depthWrite: false, fog: false });
  const s = new THREE.Sprite(mat);
  const a = rnd() * Math.PI * 2, r = range(180, 800), w = range(80, 170);
  s.position.set(Math.cos(a) * r, range(80, 190), Math.sin(a) * r);
  s.scale.set(w, w * 0.42, 1);
  s.userData = { speed: range(1, 2.6), alpha: range(0.7, 0.95) };
  scene.add(s);
  clouds.push(s);
}

const starPos = [];
for (let i = 0; i < 1800; i++) {
  const th = rnd() * Math.PI * 2, ph = Math.acos(rnd() * 0.98), r = 1500;
  starPos.push(r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph), r * Math.sin(ph) * Math.sin(th));
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute("position", new THREE.Float32BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, transparent: true, opacity: 0, depthWrite: false, fog: false });
scene.add(new THREE.Points(starGeo, starMat));

// ================= Ánh sáng =================
const sun = new THREE.DirectionalLight(0xffffff, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
Object.assign(sun.shadow.camera, { left: -75, right: 75, top: 75, bottom: -75, near: 1, far: 420 });
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0xcfe7ff, 0x4d6b3a, 1.1);
scene.add(hemi);

// ================= Mặt đất, đồi, đường, hồ =================
const grassTex = canvasTex(256, 256, (g) => {
  g.fillStyle = "#5b8c3a"; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 6000; i++) {
    g.fillStyle = `hsl(${86 + rnd() * 22}, ${36 + rnd() * 20}%, ${28 + rnd() * 22}%)`;
    g.fillRect(rnd() * 256, rnd() * 256, 1 + rnd() * 2, 2 + rnd() * 3);
  }
}, [520, 520]);
const ground = new THREE.Mesh(new THREE.CircleGeometry(2600, 72), std(0xffffff, { map: grassTex, roughness: 0.96 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const hillGeo = new THREE.SphereGeometry(1, 32, 16);
for (let i = 0; i < 18; i++) {
  const a = (i / 18) * Math.PI * 2 + rnd() * 0.25, r = range(430, 720);
  const hill = new THREE.Mesh(hillGeo, std(pick([0x4c7a3d, 0x557f40, 0x3f6b35]), { roughness: 1 }));
  hill.scale.set(range(110, 220), range(30, 75), range(100, 190));
  hill.position.set(Math.cos(a) * r, -10, Math.sin(a) * r);
  scene.add(hill);
}

const ROAD_Z = 50;
const asphalt = std(0x3b4048, { roughness: 0.92 });
const paving = std(0xc9c2b4, { roughness: 0.85 });
box(asphalt, 1800, 0.04, 10, 0, 0.02, ROAD_Z);
box(paving, 1800, 0.08, 3, 0, 0.04, ROAD_Z - 6.5);
box(paving, 1800, 0.08, 3, 0, 0.04, ROAD_Z + 6.5);
const dash = new THREE.InstancedMesh(UNIT, std(0xf1f5f9, { roughness: 0.7 }), 120);
const m4 = new THREE.Matrix4(), q4 = new THREE.Quaternion(), v3 = new THREE.Vector3(), s3 = new THREE.Vector3(), col = new THREE.Color();
const UP = new THREE.Vector3(0, 1, 0);
for (let i = 0; i < 120; i++) dash.setMatrixAt(i, m4.compose(v3.set(-480 + i * 8, 0.05, ROAD_Z), q4.identity(), s3.set(3.2, 0.02, 0.22)));
dash.receiveShadow = true;
scene.add(dash);

// Lối đi lát đá từ vỉa hè vào sảnh và quảng trường trước cửa
box(paving, 5, 0.06, 26, 0, 0.03, 30);
box(paving, 18, 0.06, 6, 0, 0.03, 17);

const POND = { x: -40, z: 24, r: 9 };
const water = new THREE.Mesh(new THREE.CircleGeometry(POND.r, 48), std(0x2c6e9b, { roughness: 0.06, metalness: 0.15 }));
water.rotation.x = -Math.PI / 2; water.position.set(POND.x, 0.06, POND.z); water.receiveShadow = true;
scene.add(water);
const rim = new THREE.Mesh(new THREE.TorusGeometry(POND.r + 0.3, 0.45, 10, 64), std(0x9ca3af, { roughness: 0.9 }));
rim.rotation.x = Math.PI / 2; rim.position.set(POND.x, 0.1, POND.z); rim.scale.z = 0.5; rim.receiveShadow = true;
scene.add(rim);
const padMat = std(0x4d8b3a, { roughness: 0.7 });
for (let i = 0; i < 7; i++) {
  const pad = new THREE.Mesh(new THREE.CircleGeometry(range(0.5, 0.9), 16, 0.4, Math.PI * 1.85), padMat);
  const a = rnd() * Math.PI * 2, d = range(2, POND.r - 1.5);
  pad.rotation.set(-Math.PI / 2, 0, rnd() * 6); pad.position.set(POND.x + Math.cos(a) * d, 0.08, POND.z + Math.sin(a) * d);
  scene.add(pad);
}

// Ghế đá & đèn đường
const benchWood = std(0x8b5a2b, { roughness: 0.7 }), ironMat = std(0x1f2937, { roughness: 0.4, metalness: 0.7 });
function bench(x, z, ry) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g);
  box(benchWood, 2.2, 0.08, 0.6, 0, 0.5, 0, g);
  box(benchWood, 2.2, 0.5, 0.08, 0, 0.8, -0.28, g);
  for (const sx of [-0.95, 0.95]) box(ironMat, 0.08, 0.5, 0.55, sx, 0.25, 0, g);
}
bench(POND.x + 11, POND.z - 2, -Math.PI / 2);
bench(POND.x, POND.z - 11.5, 0);
bench(6, 26, -Math.PI / 2);
bench(-6, 34, Math.PI / 2);

const lampMats = [];
const glowTex = canvasTex(64, 64, (g) => {
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, "rgba(255,226,170,1)"); gr.addColorStop(1, "rgba(255,226,170,0)");
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
});
const glows = [];
function lamp(x, z) {
  cyl(ironMat, 0.07, 0.1, 4, x, 2, z, scene, 10);
  const mat = std(0xfff1d6, { emissive: 0xffd9a0, emissiveIntensity: 0.2, roughness: 0.3 });
  lampMats.push(mat);
  const bulb = cyl(mat, 0.3, 0.22, 0.45, x, 4.1, z, scene, 16);
  bulb.castShadow = false;
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0 }));
  glow.position.set(x, 4.1, z); glow.scale.setScalar(3.2);
  scene.add(glow); glows.push(glow);
}
for (const z of [20, 30, 40]) { lamp(-3.4, z); lamp(3.4, z); }
for (let x = -60; x <= 60; x += 20) lamp(x, ROAD_Z - 8.4);

// ================= Cây cối (instancing + gió lay) =================
const wind = { value: 0 };
function windMat(o = {}) {
  const m = std(0xffffff, o);
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = wind;
    sh.vertexShader = "uniform float uTime;\n" + sh.vertexShader.replace("#include <begin_vertex>", `#include <begin_vertex>
      #ifdef USE_INSTANCING
        vec3 ip = instanceMatrix[3].xyz;
      #else
        vec3 ip = vec3(0.0);
      #endif
      float hgt = max(position.y + 1.0, 0.0);
      float sw = sin(uTime * 1.3 + ip.x * 0.21 + ip.z * 0.17) * 0.045 + sin(uTime * 2.9 + ip.z * 0.37) * 0.016;
      transformed.x += sw * hgt;
      transformed.z += sw * 0.6 * hgt;`);
  };
  return m;
}
const leafParts = [], coneParts = [], trunkParts = [], bushParts = [], flowerParts = [];
const part = (list, x, y, z, sx, sy, sz, color, ry = 0) => list.push({ x, y, z, sx, sy, sz, color, ry });
const LEAF = [0x4f8a3c, 0x5c9a43, 0x3f7a35, 0x6aa84f, 0x77a843, 0x4a7f3a];
const AUTUMN = [0xd4a017, 0xc2601e, 0xb8862b];
const PINE = [0x2f5d3a, 0x376b43, 0x2a5233];
const shade = (hex, k) => col.set(hex).offsetHSL(0, 0, k).getHex();

function addTree(x, z, kind = rnd() < 0.3 ? "pine" : "round") {
  const s = range(0.8, 1.35);
  if (kind === "pine") {
    const th = 1.5 * s, c = pick(PINE);
    part(trunkParts, x, 0, z, 0.28 * s, th + 1.2 * s, 0.28 * s, 0x5a3d2b);
    for (let i = 0; i < 3; i++) {
      const r = (2.5 - i * 0.65) * s, hg = (3.3 - i * 0.45) * s;
      part(coneParts, x, th + i * 1.7 * s + hg / 2, z, r, hg, r, shade(c, i * 0.03), rnd() * 6);
    }
  } else {
    const th = range(2.2, 3.2) * s, c = rnd() < 0.1 ? pick(AUTUMN) : pick(LEAF);
    part(trunkParts, x, 0, z, 0.32 * s, th + 0.9 * s, 0.32 * s, 0x6b4a33);
    part(leafParts, x, th + 1.7 * s, z, 2.2 * s, 2.0 * s, 2.2 * s, c);
    const n = 3 + Math.floor(rnd() * 3);
    for (let i = 0; i < n; i++) {
      const a = rnd() * Math.PI * 2, d = range(0.9, 1.6) * s, r = range(1.1, 1.6) * s;

function setHour(h) {
  const t = (h - 6) / 13;                                   // 6:00 → 0, 19:00 → 1

  day = smoothstep(elev, -5, 9);
  golden = day * (1 - smoothstep(elev, 3, 26));

  sun.position.copy(sunDir).multiplyScalar(180);
  sun.intensity = 5.2 * day * smoothstep(elev, -2, 6);
  sun.color.copy(SUN_WHITE).lerp(SUN_GOLD, golden);
  hemi.intensity = 0.25 + 0.9 * day;
  hemi.color.set(0xcfe7ff).lerp(new THREE.Color(0x30406a), 1 - day);
  gl.toneMappingExposure = lerp(0.85, 0.5, day);
  const night = 1 - day, u = skyMat.uniforms;
  u.uTop.value.copy(SKY.night.top).lerp(SKY.day.top, day).lerp(SKY.gold.top, golden * 0.55);
  u.uHor.value.copy(SKY.night.hor).lerp(SKY.day.hor, day).lerp(SKY.gold.hor, golden * 0.85);
  u.uSun.value.copy(sunDir);
  u.uSunCol.value.copy(SUN_WHITE).lerp(SUN_GOLD, golden).multiplyScalar(smoothstep(elev, -3, 2));
  u.uMoon.value.set(-sunDir.x, Math.max(0.45, -sunDir.y), -sunDir.z);
  u.uNight.value = smoothstep(night, 0.4, 1);
  scene.fog.color.copy(u.uHor.value);
  starMat.opacity = smoothstep(night, 0.4, 1);
  for (const c of clouds) {
    c.material.color.copy(CLOUD_DAY).lerp(CLOUD_GOLD, golden).lerp(CLOUD_NIGHT, night);
    c.material.opacity = c.userData.alpha * (0.35 + 0.65 * day);
  }
  for (const m of lampMats) m.emissiveIntensity = 0.2 + 3 * night;
  for (const g of glows) g.material.opacity = 0.85 * smoothstep(night, 0.3, 0.9);
  ledMat.emissiveIntensity = 0.6 + 1.6 * night;
  shadeMat.emissiveIntensity = 0.5 + 1.5 * night;
  for (const p of roomLights) p.intensity = 5 + 25 * night;

  const hh = Math.floor(h), mm = Math.round((h - hh) * 60);
  $("hourTxt").textContent = String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
  envDirty = true;
}
$("hour").addEventListener("input", (e) => setHour(parseFloat(e.target.value)));
setHour(parseFloat($("hour").value));

// ================= Camera: ngoài trời / trong văn phòng =================
const VIEWS = {
  out: { pos: new THREE.Vector3(26, 12, 66), target: new THREE.Vector3(0, 6, 0), min: 12, max: 260, polar: 1.48 },
  in: { pos: new THREE.Vector3(1.5, BASE + 2.2, 11.5), target: new THREE.Vector3(0, BASE + 1.6, -1), min: 0.6, max: 15, polar: 1.9 },
};
let mode = "out", tween = null;
function applyLimits(v) {
  controls.minDistance = v.min; controls.maxDistance = v.max; controls.maxPolarAngle = v.polar;
}
function flyTo(name, ms = 1800) {
  mode = name;
  const v = VIEWS[name];
  // Màn dọc (điện thoại) hẹp ngang: lùi camera ngoài trời ra xa để thấy trọn toà nhà.
  const far = name === "out" && camera.aspect < 1 ? 1.8 : 1;
  const p1 = v.pos.clone().sub(v.target).multiplyScalar(far).add(v.target);
  tween = { p0: camera.position.clone(), t0: controls.target.clone(), p1, t1: v.target.clone(), start: performance.now(), ms: reduceMotion ? 1 : ms, v };
  $("btnOut").setAttribute("aria-pressed", String(name === "out"));
  $("btnIn").setAttribute("aria-pressed", String(name === "in"));
}
$("btnOut").onclick = () => flyTo("out");
$("btnIn").onclick = () => flyTo("in");
$("btnRoof").onclick = (e) => {
  roof.visible = !roof.visible;
  ceiling.visible = roof.visible;
  e.currentTarget.setAttribute("aria-pressed", String(!roof.visible));
};
$("btnTour").onclick = (e) => {
  controls.autoRotate = !controls.autoRotate;
  e.currentTarget.setAttribute("aria-pressed", String(controls.autoRotate));
};

camera.position.set(150, 80, 190);
controls.target.copy(VIEWS.out.target);
camera.lookAt(controls.target);
flyTo("out", 3200);

// ================= Vòng lặp =================
const clock = new THREE.Clock();
let first = true;
gl.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
  if (!reduceMotion) wind.value = t;

  for (const c of clouds) {
    c.position.x += dt * c.userData.speed;
    if (c.position.x > 850) c.position.x = -850;
  }

  if (tween) {
    const u = Math.min(1, (performance.now() - tween.start) / tween.ms);
    const e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.t0, tween.t1, e);
    camera.lookAt(controls.target);
    if (u >= 1) { applyLimits(tween.v); tween = null; }
  } else {
    controls.update();
  }

  if (envDirty && performance.now() - envAt > 180) updateEnv();
  lblR.domElement.style.visibility = mode === "in" || camera.position.distanceTo(controls.target) < 55 ? "visible" : "hidden";

  skyDome.position.copy(camera.position);
  gl.render(scene, camera);
  lblR.render(scene, camera);
  if (first) { first = false; window.vp3dReady = true; $("state").classList.add("done"); }
});
</script>
