<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Văn phòng AI chưa chạy</title>
<meta name="theme-color" content="#06080d">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06080d;color:#f2f2f2;font-family:system-ui,"Segoe UI",sans-serif;padding:24px;box-sizing:border-box}
.box{max-width:460px;text-align:center}
h1{font-size:20px;margin:16px 0 8px}
p{color:#a6a6a6;font-size:14px;line-height:1.6;margin:6px 0}
code{background:#151515;border:1px solid #242424;border-radius:6px;padding:2px 6px;color:#ecc970}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ecc970;margin-right:6px;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.25}}
</style>
</head>
<body>
<div class="box">
  <!-- Biểu tượng nhúng thẳng: khi văn phòng tắt không tải được file nào khác ngoài trang này -->
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="88" height="88" aria-hidden="true">
    <rect width="512" height="512" rx="112" fill="#06080d"/>
    <circle cx="256" cy="256" r="168" fill="none" stroke="#ecc970" stroke-width="22" opacity="0.35"/>
    <path d="M256 256 m0 -18 a18 18 0 1 1 -18 18 a36 36 0 0 1 36 -36 a54 54 0 0 1 54 54 a72 72 0 0 1 -72 72 a90 90 0 0 1 -90 -90 a108 108 0 0 1 108 -108 a126 126 0 0 1 126 126"
          fill="none" stroke="#ecc970" stroke-width="22" stroke-linecap="round"/>
    <circle cx="256" cy="256" r="12" fill="#ecc970"/>
  </svg>
  <h1>Văn phòng AI chưa chạy</h1>
  <p>Bấm biểu tượng <b>Văn phòng AI</b> trên Desktop để bật, hoặc mở terminal trong thư mục văn phòng và chạy <code>npm run app</code>.</p>
  <p>Đang mở trên điện thoại: kiểm tra Tailscale đã bật trên điện thoại và máy tính chạy văn phòng đang mở.</p>
  <p><span class="dot"></span>Đang chờ văn phòng bật, trang sẽ tự mở lại…</p>
</div>
<script>
// Thử lại mỗi 3 giây; văn phòng trả lời là tải lại trang gốc.
setInterval(() => { fetch("/manifest.webmanifest", { cache: "no-store" }).then((r) => { if (r.ok || r.status === 401) location.reload(); }).catch(() => {}); }, 3000);
</script>
</body>
</html>
