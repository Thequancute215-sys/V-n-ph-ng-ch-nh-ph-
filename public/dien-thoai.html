<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Điện thoại điều khiển</title>
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="app.js" defer></script>
<style>
  :root { --bg: #05070a; --card: #11151c; --line: #232a35; --text: #e8ecf1; --muted: #9aa4b2; --accent: #ecc970; --bad: #f87171; }
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 760px; padding: 20px 16px 48px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
  a { color: var(--accent); }
  h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 17px; margin: 0 0 8px; }
  .muted { color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 14px 0; }
  button { font: inherit; min-height: 44px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line); background: #1a202a; color: inherit; cursor: pointer; }
  button.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 700; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .code { font: 700 44px/1.1 ui-monospace, Consolas, monospace; letter-spacing: 10px; color: var(--accent); margin: 10px 0 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; } td, th { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  ol { padding-left: 20px; } code { background: #0b0f14; padding: 1px 6px; border-radius: 6px; }
  .err { color: var(--bad); }
</style>
</head>
<body>
<p><a href="/">← Về văn phòng</a></p>
<h1>Điện thoại điều khiển</h1>
<p class="muted">Ghép điện thoại để giao việc, duyệt báo cáo và dừng khẩn cấp từ xa. Trang này chỉ dùng được trên chính máy tính chạy văn phòng.</p>
<div id="out"><div class="card">Đang tải…</div></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const when = (v) => v ? new Date(v).toLocaleString("vi-VN") : "—";
let code = null, tick = null;
async function api(path, body) {
  const r = await fetch("/dkx" + path, { cache: "no-store", method: body === undefined ? "GET" : "POST", ...(body === undefined ? {} : { headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }) });
  let d = null; try { d = await r.json(); } catch {}
  if (!r.ok || !d || d.ok === false) throw new Error((d && d.error) || "Lỗi " + r.status);
  return d;
}
const SU = { "tao-ma": "Tạo mã ghép", ghep: "Ghép máy mới", "ghep-sai": "Nhập sai mã", "thu-hoi": "Thu hồi máy", lenh: "Lệnh", chan: "Lệnh bị chặn" };
async function load() {
  try {
    const [d, k] = await Promise.all([api("/thiet-bi"), api("/nhat-ky")]);
    const left = code ? Math.max(0, Math.round((new Date(code.hetLuc) - Date.now()) / 1000)) : 0;
    $("out").innerHTML = `
      <div class="card"><h2>1. Tạo mã ghép</h2>
        ${code && left ? `<div class="code" aria-live="polite">${esc(code.ma)}</div><p class="muted">Nhập mã này trên điện thoại. Còn ${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}, dùng được một lần.</p>` : '<p class="muted">Mã có 6 số, hết hạn sau 5 phút. Sai 5 lần thì khóa ghép 15 phút.</p>'}
        <button type="button" class="primary" id="mk">${code && left ? "Tạo mã khác" : "Tạo mã ghép"}</button></div>
      <div class="card"><h2>2. Mở trên điện thoại</h2><ol>
        <li>Văn phòng phải có <b>khóa xem</b> (<code>accessKey</code> trong <code>config.json</code>). Chưa có thì điện thoại không vào được, kể cả đã ghép.</li>
        <li>Mở đường hầm: <code>powershell -ExecutionPolicy Bypass -File scripts\\xem-tren-dien-thoai.ps1</code> (cùng Wi-Fi thì dùng <code>http://&lt;IP máy&gt;:&lt;cổng&gt;</code>).</li>
        <li>Trên điện thoại mở link đó, nhập khóa xem, rồi vào <code>/dieu-khien.html</code> và nhập mã ghép.</li></ol></div>
      <div class="card"><h2>Máy đã ghép (${d.thietBi.length}/5)</h2>${d.thietBi.length ? `<table><tr><th>Tên</th><th>Ghép lúc</th><th>Dùng gần nhất</th><th></th></tr>${d.thietBi.map((t) => `<tr><td>${esc(t.ten)}<br><span class="muted">${esc(t.ip || "")}</span></td><td>${when(t.taoLuc)}</td><td>${when(t.dungLuc)}</td><td><button type="button" data-revoke="${esc(t.id)}">Thu hồi</button></td></tr>`).join("")}</table>` : '<p class="muted">Chưa ghép máy nào.</p>'}</div>
      <div class="card"><h2>Nhật ký điều khiển từ xa</h2>${k.nhatKy.length ? `<table>${k.nhatKy.slice(0, 40).map((x) => `<tr><td>${when(x.at)}</td><td>${esc(SU[x.su] || x.su)}${x.lenh ? ": <code>" + esc(x.lenh) + "</code>" : ""}${x.ketQua ? " → " + esc(x.ketQua) : ""}</td><td>${esc(x.ten || "")}<br><span class="muted">${esc(x.ip || "")}</span></td></tr>`).join("")}</table>` : '<p class="muted">Chưa có lệnh nào từ điện thoại.</p>'}</div>`;
    $("mk").onclick = async () => { try { code = await api("/ma", {}); load(); } catch (e) { alertErr(e); } };
  } catch (e) { alertErr(e); }
}
function alertErr(e) { $("out").innerHTML = `<div class="card"><p class="err">${esc(e.message)}</p><button type="button" onclick="location.reload()">Thử lại</button></div>`; }
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-revoke]"); if (!b) return;
  if (!confirm("Thu hồi máy này? Máy đó sẽ phải ghép lại mới điều khiển được.")) return;
  try { await api("/thu-hoi", { id: b.dataset.revoke }); load(); } catch (err) { alertErr(err); }
});
load(); tick = setInterval(() => { if (code) load(); }, 5000);
</script>
</body>
</html>
