# Kiểm bản phát hành khi CEO đẩy tag vX.Y.Z (kênh "phat-hanh" của nút Cập nhật trong app đọc các tag này).
# Chỉ kiểm, không build hay triển khai gì: tag sai thì báo đỏ để CEO xoá tag trước khi người dùng bấm cập nhật.
name: Kiểm bản phát hành

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  kiem-ban-phat-hanh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tag đúng mẫu vX.Y.Z và khớp phiên bản trong package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const tag = process.env.TAG, v = require("./package.json").version;
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) { console.error("Tag " + tag + " không đúng mẫu vX.Y.Z: nút Cập nhật sẽ bỏ qua tag này."); process.exit(1); }
            if (tag !== "v" + v) { console.error("Tag " + tag + " nhưng package.json ghi " + v + ": sửa version qua PR rồi tag lại."); process.exit(1); }
            console.log("Tag " + tag + " khớp package.json.");'
      - name: Bản phát hành nằm trên main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Commit của tag không nằm trên main: chỉ phát hành bản đã merge vào main."; exit 1; }
      - name: Chạy test
        run: npm test
